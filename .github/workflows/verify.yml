# Independent verification for nostdb-spec.
#
# The root contract requires every child repository to format, build, lint, and
# test independently. Stage 1 carries scaffolding only, so this workflow runs the
# repository verifier. Stage 2 extends it with grammar, format-contract,
# protocol-schema, and conformance-fixture checks, and adds the Rust command set
# once executable code lands.
#
# Action dependency: actions/checkout, maintained by GitHub, MIT licensed, and
# pinned to the exact commit of tag v7.0.1 rather than a floating major tag.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify the repository
        run: ./scripts/verify-repository.sh
